name: Keep final OBD11 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-releases.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const keep = await github.rest.repos.getReleaseByTag({...repo, tag: 'v1.1.0'});
            const asset = keep.data.assets.find(a => a.name === 'com.551.obdelevenupdatebypass_1.1.0_iphoneos-arm64.deb');
            if (!asset || asset.size !== 15642) throw new Error('Final DEB missing or changed; cleanup stopped.');
            const oldTags = ["v1.0.8","v1.0.7","v1.0.6","v1.0.5","v1.0.4","v1.0.3","v1.0.2","v1.0.1","v1.0.0"];
            for (const tag of oldTags) {
              let release;
              try { release = await github.rest.repos.getReleaseByTag({...repo, tag}); }
              catch (e) { if (e.status !== 404) throw e; }
              if (release) {
                await github.rest.repos.deleteRelease({...repo, release_id: release.data.id});
                core.info('Deleted release ' + tag);
              }
              try {
                await github.rest.git.deleteRef({...repo, ref: 'tags/' + tag});
                core.info('Deleted tag ' + tag);
              } catch (e) { if (e.status !== 404 && e.status !== 422) throw e; }
            }
            const remaining = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            if (remaining.length !== 1 || remaining[0].tag_name !== 'v1.1.0') throw new Error('Unexpected remaining releases');
            core.info('Verified: only v1.1.0 remains.');
