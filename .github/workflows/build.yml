name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obdeleven-update-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Verify patched iOS 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Fetch official OBDeleven Settings icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p layout/Library/PreferenceLoader/Preferences
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          lookup = "https://itunes.apple.com/lookup?id=1643119107&country=gb"
          request = urllib.request.Request(lookup, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          if not payload.get("results"):
              raise SystemExit("OBDeleven App Store lookup returned no results")

          result = payload["results"][0]
          artwork = result.get("artworkUrl512") or result.get("artworkUrl100") or result.get("artworkUrl60")
          if not artwork:
              raise SystemExit("OBDeleven App Store artwork URL was missing")

          destination = pathlib.Path("layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png")
          image_request = urllib.request.Request(artwork, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(image_request, timeout=30) as response:
              destination.write_bytes(response.read())

          if destination.stat().st_size < 1000:
              raise SystemExit("Downloaded OBDeleven icon is unexpectedly small")
          print(f"Downloaded official OBDeleven icon: {destination.stat().st_size} bytes")
          PY

          cp layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png \
             layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@2x.png
          cp layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png \
             layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@3x.png

          /usr/bin/sips -z 29 29 layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png >/dev/null
          /usr/bin/sips -z 58 58 layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@2x.png >/dev/null
          /usr/bin/sips -z 87 87 layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@3x.png >/dev/null

          test "$(/usr/bin/sips -g pixelWidth layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png | awk '/pixelWidth/ {print $2}')" = "29"
          test "$(/usr/bin/sips -g pixelWidth layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@2x.png | awk '/pixelWidth/ {print $2}')" = "58"
          test "$(/usr/bin/sips -g pixelWidth layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@3x.png | awk '/pixelWidth/ {print $2}')" = "87"

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.obdelevenupdatebypass"
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.7"
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/obdeleven-check"

          root="$RUNNER_TEMP/obdeleven-check/var/jb"
          dylib="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.dylib"
          filter="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.plist"
          entry="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypassPrefs.plist"
          icon="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png"
          icon2="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@2x.png"
          icon3="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass@3x.png"
          bundle="$root/Library/PreferenceBundles/OBDelevenUpdateBypassPrefs.bundle"
          prefs_binary="$bundle/OBDelevenUpdateBypassPrefs"
          prefs_root="$bundle/Root.plist"
          prefs_info="$bundle/Info.plist"

          test -s "$dylib"
          test -s "$filter"
          test -s "$entry"
          test -s "$icon"
          test -s "$icon2"
          test -s "$icon3"
          test -s "$prefs_binary"
          test -s "$prefs_root"
          test -s "$prefs_info"

          xcrun lipo "$dylib" -verify_arch arm64
          xcrun lipo "$prefs_binary" -verify_arch arm64
          plutil -lint "$filter"
          plutil -lint "$entry"
          plutil -lint "$prefs_root"
          plutil -lint "$prefs_info"

          # The preference bundle must be linked to Apple's Preferences framework.
          # The previous dynamic_lookup build compiled on CI but failed to load in Settings.
          otool -L "$prefs_binary" | grep -q "Preferences.framework/Preferences"

          grep -q "com.voltasit.obdeleven.ios.basic" "$filter"
          grep -q "OBDelevenUpdateBypassPrefs" "$entry"
          grep -q "OBDelevenUpdateBypass.png" "$entry"
          grep -q "PSSwitchCell" "$prefs_root"
          grep -q "PSEditTextCell" "$prefs_root"
          grep -q "<string>readPreferenceValue:</string>" "$prefs_root"
          grep -q "<string>setPreferenceValue:specifier:</string>" "$prefs_root"
          grep -q "<key>get</key>" "$prefs_root"
          grep -q "<key>set</key>" "$prefs_root"
          ! grep -q "<key>getter</key>" "$prefs_root"
          ! grep -q "<key>setter</key>" "$prefs_root"
          grep -q "spoofedVersion" "$prefs_root"
          grep -q "x-mobile-app-version" "$prefs_root"
          grep -q "Reset Working Default" "$prefs_root"
          grep -q "Respring" "$prefs_root"
          grep -q "GitHub Repository" "$prefs_root"

          strings "$dylib" | grep -q "v1.0.7 loaded"
          strings "$dylib" | grep -q "2.10.0"
          strings "$dylib" | grep -q "2147483647"
          strings "$dylib" | grep -q "x-mobile-app-version"
          strings "$dylib" | grep -q "spoofedVersion"
          strings "$dylib" | grep -q "objectForInfoDictionaryKey:"
          strings "$dylib" | grep -q "dataTaskWithRequest:completionHandler:"
          strings "$prefs_binary" | grep -q "setPreferenceValue:specifier:"
          strings "$prefs_binary" | grep -q "resetWorkingDefaults"
          strings "$prefs_binary" | grep -q "respring"
          strings "$prefs_binary" | grep -q "openGitHub"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBDelevenUpdateBypass-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release DEB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          title="OBDeleven Update Bypass ${version}"
          notes="v1.0.7 repairs the Settings bundle and the preference wiring. The bundle is now linked against Apple's Preferences framework instead of using dynamic_lookup, which fixes the damaged/missing resources page. The Enabled switch and Spoofed Version field now use the correct Preferences get/set keys and persist to the same domain read by the injected tweak. Setting Spoofed Version to the real 1.11.0, or disabling the tweak, turns off CFBundleShortVersionString, CFBundleVersion and x-mobile-app-version spoofing together. Respring and GitHub buttons remain included. The official OBDeleven Settings icon is supplied at normal 29pt 1x/2x/3x sizes."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" packages/*.deb \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
