name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obdeleven-update-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Fetch official OBDeleven Settings icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p layout/Library/PreferenceLoader/Preferences
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          lookup = "https://itunes.apple.com/lookup?id=1643119107&country=gb"
          request = urllib.request.Request(lookup, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          if not payload.get("results"):
              raise SystemExit("OBDeleven App Store lookup returned no results")

          result = payload["results"][0]
          artwork = result.get("artworkUrl512") or result.get("artworkUrl100") or result.get("artworkUrl60")
          if not artwork:
              raise SystemExit("OBDeleven App Store artwork URL was missing")

          destination = pathlib.Path("layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png")
          image_request = urllib.request.Request(artwork, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(image_request, timeout=30) as response:
              destination.write_bytes(response.read())

          if destination.stat().st_size < 1000:
              raise SystemExit("Downloaded OBDeleven icon is unexpectedly small")
          print(f"Downloaded official OBDeleven icon: {destination.stat().st_size} bytes")
          PY

          # PreferenceLoader treats a plain PNG as a 1x image. Resize it to the
          # normal Settings preference icon size instead of feeding it 512x512 artwork.
          /usr/bin/sips -z 29 29 layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png >/dev/null
          test "$(/usr/bin/sips -g pixelWidth layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png | awk '/pixelWidth/ {print $2}')" = "29"
          test "$(/usr/bin/sips -g pixelHeight layout/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png | awk '/pixelHeight/ {print $2}')" = "29"

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.obdelevenupdatebypass"
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.6"
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/obdeleven-check"

          root="$RUNNER_TEMP/obdeleven-check/var/jb"
          dylib="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.dylib"
          filter="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.plist"
          entry="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypassPrefs.plist"
          icon="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypass.png"
          bundle="$root/Library/PreferenceBundles/OBDelevenUpdateBypassPrefs.bundle"
          prefs_binary="$bundle/OBDelevenUpdateBypassPrefs"
          prefs_root="$bundle/Root.plist"
          prefs_info="$bundle/Info.plist"

          test -s "$dylib"
          test -s "$filter"
          test -s "$entry"
          test -s "$icon"
          test -s "$prefs_binary"
          test -s "$prefs_root"
          test -s "$prefs_info"

          xcrun lipo "$dylib" -verify_arch arm64
          xcrun lipo "$prefs_binary" -verify_arch arm64
          plutil -lint "$filter"
          plutil -lint "$entry"
          plutil -lint "$prefs_root"
          plutil -lint "$prefs_info"

          grep -q "com.voltasit.obdeleven.ios.basic" "$filter"
          grep -q "OBDelevenUpdateBypassPrefs" "$entry"
          grep -q "OBDelevenUpdateBypass.png" "$entry"
          grep -q "PSSwitchCell" "$prefs_root"
          grep -q "PSEditTextCell" "$prefs_root"
          grep -q "spoofedVersion" "$prefs_root"
          grep -q "x-mobile-app-version" "$prefs_root"
          grep -q "Reset Working Default" "$prefs_root"
          grep -q "Respring" "$prefs_root"
          grep -q "GitHub Repository" "$prefs_root"

          strings "$dylib" | grep -q "v1.0.6 loaded"
          strings "$dylib" | grep -q "2.10.0"
          strings "$dylib" | grep -q "2147483647"
          strings "$dylib" | grep -q "x-mobile-app-version"
          strings "$dylib" | grep -q "spoofedVersion"
          strings "$dylib" | grep -q "objectForInfoDictionaryKey:"
          strings "$dylib" | grep -q "dataTaskWithRequest:completionHandler:"
          strings "$prefs_binary" | grep -q "setPreferenceValue:specifier:"
          strings "$prefs_binary" | grep -q "resetWorkingDefaults"
          strings "$prefs_binary" | grep -q "respring"
          strings "$prefs_binary" | grep -q "openGitHub"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBDelevenUpdateBypass-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release DEB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          title="OBDeleven Update Bypass ${version}"
          notes="Rootless Dopamine/ElleKit tweak for regular OBDeleven 1.11.0 on iOS 16. v1.0.6 fixes the Settings wiring so the selected version is actually read by the injected tweak. Spoofed Version controls the runtime version/header spoof, and setting it back to the app's real 1.11.0 disables every spoof and restores the original bundle/network values. The known-working 2147483647 CFBundleVersion spoof remains active only while a newer version is selected. Also adds a Respring button, GitHub Repository button, and resizes the official OBDeleven Settings icon to the normal PreferenceLoader size."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" packages/*.deb \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
